version: "3.9"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_ALLOW_INSECURE_BACKEND: ${NEXT_PUBLIC_ALLOW_INSECURE_BACKEND:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
